[project]
name = "m117"
version = "0.1.0"
description = "Team 10A: multi-agent prompt-injection testbed"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.8", "pyyaml>=6", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
